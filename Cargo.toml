[package]
name = "entropy-tokenizer"
version = "0.1.0"
edition = "2021"
description = "Entropy-optimal tokenizer that outperforms BPE/Unigram via entropy-guided merge selection and DP-optimal encoding"
license = "MIT"
readme = "README.md"

[lib]
name = "entropy_tokenizer"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "eot"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[features]
default = []
python = ["pyo3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
